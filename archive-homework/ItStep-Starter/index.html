<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fronty`s💮</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        body {
            background: #08382b;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 1rem;
        }

        .code-blocks {
            max-width: 850px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0;
            background: transparent;
        }

        .black-stripe {
            background: #0a0a0a;
            height: 6px;
            width: 100%;
            border-radius: 3px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.7);
            margin: 0;
            flex-shrink: 0;
        }

        .code-slot {
            background: #06291f;
            padding: 2rem;
        }

        .code-slot h1 {
            color: #e6f0ea;
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            font-weight: normal;
            margin-bottom: 1.5rem;
        }

        .code-slot h2 {
            color: #e6f0ea;
            font-family: 'Courier New', monospace;
            font-size: 1.3rem;
            font-weight: normal;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
        }

        .code-slot input,
        .code-slot select {
            background: transparent;
            color: #e6f0ea;
            font-family: 'Courier New', monospace;
            padding: 10px;
            margin: 5px 5px 5px 0;
            border: 1.5px solid #e6f0ea;
            border-radius: 3px;
            font-size: 1rem;
        }

        .code-slot input::placeholder {
            color: #7a9b8e;
        }

        .code-slot select option {
            background: #08382b;
            color: #e6f0ea;
        }

        .btn {
            background: transparent;
            color: #e6f0ea;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            padding: 10px 28px;
            border: 1.5px solid #e6f0ea;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.03);
            margin: 5px 5px 5px 0;
        }

        .btn:hover {
            background: #e6f0ea;
            color: #08382b;
            box-shadow: 0 0 20px rgba(230, 240, 234, 0.15);
        }

        .danger:hover {
            background: #dc2626;
            color: #e6f0ea;
            border-color: #dc2626;
        }

        .filter-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .card {
            color: #e6f0ea;
            background: rgba(255, 255, 255, 0.06);
            padding: 15px;
            margin: 10px 0;
            border-radius: 3px;
            border: 1px solid rgba(230, 240, 234, 0.15);
            line-height: 1.8;
        }

        .status-new {
            color: #60a5fa;
        }

        .status-work {
            color: #fbbf24;
        }

        .status-done {
            color: #4ade80;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 600px) {
            .code-slot {
                padding: 1.2rem 1rem;
            }

            .code-slot input,
            .code-slot select,
            .btn {
                width: 100%;
            }

            .filter-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="code-blocks">
        <div class="black-stripe"></div>
        <div class="code-slot">

            <h2>Новая заявка</h2>
            <input id="clientName" placeholder="Имя клиента">
            <input id="clientPhone" placeholder="Телефон">
            <input id="clientService" placeholder="Услуга">
            <button class="btn" onclick="addRequest()">Добавить заявку</button>

            <h2>Фильтр</h2>
            <div class="filter-container">
                <select id="statusFilter">
                    <option value="all">Все</option>
                    <option value="new">Новая</option>
                    <option value="work">В работе</option>
                    <option value="done">Закрыта</option>
                </select>
                <button class="btn" onclick="filterRequests()">Показать</button>
                <button class="btn" onclick="showAll()">Показать все</button>
            </div>

            <h2>Список заявок</h2>
            <div id="list"></div>
        </div>
        <div class="black-stripe"></div>
    </div>

    <script>
        function getRequests() {
            return JSON.parse(localStorage.getItem("crmRequests") || "[]");
        }

        function saveRequests(requests) {
            localStorage.setItem("crmRequests", JSON.stringify(requests));
        }

        function getStatusClass(status) {
            if (status === "new") return "status-new";
            if (status === "work") return "status-work";
            if (status === "done") return "status-done";
            return "";
        }

        function getStatusText(status) {
            if (status === "new") return "Новая";
            if (status === "work") return "В работе";
            if (status === "done") return "Закрыта";
            return status;
        }

        function render(requests) {
            let list = document.getElementById("list");

            if (requests.length === 0) {
                list.innerHTML = '<div class="card">Заявок нет</div>';
                return;
            }

            let html = "";

            for (let i = 0; i < requests.length; i++) {
                let statusClass = getStatusClass(requests[i].status);
                let statusText = getStatusText(requests[i].status);

                html += '<div class="card">';
                html += '<b>Клиент:</b> ' + requests[i].name + '<br>';
                html += '<b>Телефон:</b> ' + requests[i].phone + '<br>';
                html += '<b>Услуга:</b> ' + requests[i].service + '<br>';
                html += '<b>Статус:</b> <span class="' + statusClass + '">' + statusText + '</span><br>';
                html += '<b>Дата:</b> ' + requests[i].date + '<br>';
                html += '<button class="btn" onclick="changeStatus(' + i + ', \'new\')">Новая</button>';
                html += '<button class="btn" onclick="changeStatus(' + i + ', \'work\')">В работе</button>';
                html += '<button class="btn" onclick="changeStatus(' + i + ', \'done\')">Закрыта</button>';
                html += '<button class="btn danger" onclick="deleteRequest(' + i + ')">Удалить</button>';
                html += '</div>';
            }

            list.innerHTML = html;
        }

        function addRequest() {
            let name = document.getElementById("clientName").value.trim();
            let phone = document.getElementById("clientPhone").value.trim();
            let service = document.getElementById("clientService").value.trim();

            if (!name || !phone || !service) {
                document.getElementById("list").innerHTML = '<div class="card" style="color:#dc2626;">Заполните все поля</div>';
                return;
            }

            let requests = getRequests();
            let now = new Date();
            let date = now.toLocaleDateString() + " " + now.toLocaleTimeString();

            requests.push({
                name: name,
                phone: phone,
                service: service,
                status: "new",
                date: date
            });

            saveRequests(requests);

            document.getElementById("clientName").value = "";
            document.getElementById("clientPhone").value = "";
            document.getElementById("clientService").value = "";

            showAll();
        }

        function changeStatus(index, status) {
            let requests = getRequests();
            requests[index].status = status;
            saveRequests(requests);
            filterRequests();
        }

        function deleteRequest(index) {
            let requests = getRequests();
            requests.splice(index, 1);
            saveRequests(requests);
            filterRequests();
        }

        function filterRequests() {
            let filter = document.getElementById("statusFilter").value;
            let requests = getRequests();

            if (filter === "all") {
                render(requests);
                return;
            }

            let filtered = [];

            for (let i = 0; i < requests.length; i++) {
                if (requests[i].status === filter) {
                    filtered.push(requests[i]);
                }
            }

            render(filtered);
        }

        function showAll() {
            document.getElementById("statusFilter").value = "all";
            render(getRequests());
        }

        showAll();
    </script>
</body>
</html>
