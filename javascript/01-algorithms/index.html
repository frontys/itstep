<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Algorithms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header>
            <h1>Algorithm & Array Processing</h1>
