<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Developer Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hero { background: linear-gradient(135deg, #171821 0%, #1f202c 100%); border: 1px solid #262837; border-radius: 12px; padding: 40px; margin-bottom: 24px; text-align: center; }
        .hero h1 { justify-content: center; font-size: 32px; margin-bottom: 12px; }
        .tag-list { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
        .project-card { background: #171821; border: 1px solid #262837; border-radius: 8px; padding: 18px; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>Software Engineer Portfolio</h1>
            <p class="subtitle" style="font-size:16px;">Building modern, responsive full-stack applications with React & .NET</p>
            <div class="tag-list">
                <span class="badge">React 19</span>
                <span class="badge">TypeScript</span>
                <span class="badge">C# .NET 9</span>
                <span class="badge">Python</span>
                <span class="badge">REST & Sockets</span>
            </div>
        </div>
        <div class="card">
            <h2>Featured Projects</h2>
            <div style="display:flex; gap:8px; margin-bottom:16px;">
                <button class="portBtn" data-filter="all">All</button>
                <button class="portBtn button-secondary" data-filter="react">React</button>
                <button class="portBtn button-secondary" data-filter="dotnet">.NET</button>
            </div>
            <div id="portfolioProjects"></div>
        </div>
        <div class="card">
            <h2>Contact Feedback</h2>
            <form id="contactForm">
                <input type="text" id="msgName" placeholder="Your Name" required>
                <input type="email" id="msgEmail" placeholder="Your Email" required>
                <textarea id="msgBody" rows="3" placeholder="Project inquiry details..." required></textarea>
                <button type="submit">Send Message</button>
            </form>
            <div id="contactStatus" class="output" style="display:none;"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
