<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript OOP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Object Oriented Programming in JavaScript</h1>
            <p class="subtitle">Classes: Student, Product, BankAccount, Car, Book</p>
        </header>
        <div class="grid">
            <div class="card">
                <h2>Bank Account Simulation</h2>
                <input type="number" id="amountInput" placeholder="Enter amount" value="250">
                <button id="depositBtn">Deposit</button>
                <button id="withdrawBtn" class="button-secondary">Withdraw</button>
                <div id="bankOutput" class="output">Owner: Paul | Balance: $1000</div>
            </div>
            <div class="card">
                <h2>OOP Classes Inspection</h2>
                <button id="testStudentBtn">Run Students Test</button>
                <button id="testCarsBtn" class="button-secondary">Run Cars Filter</button>
                <button id="testBooksBtn" class="button-secondary">Run Library Check</button>
                <div id="oopOutput" class="output">Ready.</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
